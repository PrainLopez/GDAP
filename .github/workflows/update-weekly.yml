name: 更新周度数据

on:
  schedule:
    # 每周日收盘时间刷新 880001 周K，顺带刷新季度 GDP/市值
    # （GDP 公布日期不固定，靠每周重跑自然补上最新季度）
    - cron: "0 4 * * 0"
  workflow_dispatch: # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 抓取 880001 周K与季度数据
        run: |
          node scripts/fetch-weekly.mjs
          node scripts/fetch.mjs
        timeout-minutes: 5

      - name: 提交数据文件（有变化时）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weekly.js data/data.js
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "chore(data): 更新 880001 与季度数据 $(date -u +%F)"
            git push
          fi
